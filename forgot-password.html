<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7f4">
  <title>Forgot Password | EAPCC Cement Sales</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: #17251e;
      background: #f5f7f4;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .card { width: min(100%, 440px); padding: 40px; background: #fff; border: 1px solid #e5ebe6; border-radius: 16px; box-shadow: 0 18px 50px #173b2912; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 36px; color: #176b43; font-weight: 750; letter-spacing: .02em; }
    .brand-mark { display: grid; width: 40px; height: 40px; place-items: center; border-radius: 11px; background: #e9f4ed; font-size: 21px; }
    h1 { margin: 0 0 10px; font-size: 1.8rem; letter-spacing: -.035em; }
    .intro { margin: 0 0 28px; color: #637168; line-height: 1.6; }
    label { display: block; margin-bottom: 8px; font-size: .9rem; font-weight: 650; }
    input { width: 100%; padding: 13px 14px; border: 1px solid #cbd6ce; border-radius: 8px; background: #fff; color: inherit; font: inherit; outline: none; }
    input:focus { border-color: #208352; box-shadow: 0 0 0 3px #20835220; }
    button { width: 100%; margin-top: 18px; padding: 13px 16px; border: 0; border-radius: 8px; background: #176b43; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #105936; }
    button:focus-visible, a:focus-visible { outline: 3px solid #78b892; outline-offset: 3px; }
    .message { min-height: 24px; margin: 14px 0 0; color: #176b43; font-size: .9rem; line-height: 1.5; }
    .back { display: inline-block; margin-top: 18px; color: #176b43; font-size: .92rem; font-weight: 650; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    @media (max-width: 480px) { .card { padding: 30px 24px; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="brand-mark" aria-hidden="true">E</span><span>EAPCC Cement Sales</span></div>
    <h1>Forgot your password?</h1>
    <p class="intro">Enter the email address associated with your account and we’ll send you instructions to reset your password.</p>
    <form id="reset-form">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      <button type="submit">Send reset instructions</button>
      <p class="message" id="message" role="status" aria-live="polite"></p>
    </form>
    <a class="back" href="login.html">← Back to sign in</a>
  </main>
  <script>
    document.getElementById('reset-form').addEventListener('submit', function (event) {
      event.preventDefault();
      document.getElementById('message').textContent = 'If an account exists for this email, password reset instructions will be sent shortly.';
    });
  </script>
</body>
</html>
